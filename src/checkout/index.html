<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>

      <div class="checkout-form-container">
        <form id="checkout-form" name="checkout-form">
          <!-- Name Information -->
          <fieldset>
            <legend>Your Name</legend>
            <label
              >Full Name<span class="required">*</span
              ><input
                type="text"
                name="fname"
                id="fname"
                required
                autocomplete="given-name"
                title="Your first Name"
                minlength="2"
                pattern="[A-Za-z\\-\\s]{2,}"
            /></label>
            <label
              >Last Name<span class="required">*</span
              ><input
                type="text"
                name="lname"
                id="lname"
                required
                autocomplete="family-name"
                title="Your Last Name"
                minlength="2"
                pattern="[A-Za-z\\-\\s]{2,}"
            /></label>
            <!-- This pattern means only letters, hyphens, and spaces are allowed, with a minimum length of 2 characters -->
          </fieldset>

          <!-- Address Information -->
          <fieldset>
            <legend>Shipping Address</legend>
            <label
              >Street Address<span class="required">*</span
              ><input
                type="text"
                name="street"
                id="street"
                required
                autocomplete="street-address"
                title="Your Street Address"
                minlength="3"
                placeholder="111 N Example St"
            /></label>

            <label
              >City<span class="required">*</span
              ><input
                type="text"
                name="city"
                id="city"
                required
                autocomplete="city"
                title="Your City"
                minlength="2"
                pattern="[A-Za-z\\-\\s]{2,}"
                placeholder="Mesa"
            /></label>

            <label
              >State/Province<span class="required">*</span
              ><input
                type="text"
                name="state"
                id="state"
                required
                autocomplete="state"
                title="Your State or Province"
                minlength="2"
                maxlength="2"
                pattern="[A-Za-z]{2}"
                placeholder="Az"
            /></label>
            <!-- This pattern means only 2 letters allowed (min and max length 2, only letters) -->
            <!-- This pattern means only 2 letters allowed (min and max length 2, only letters) -->

            <label
              >Zip/Postal Code<span class="required">*</span
              ><input
                type="text"
                name="zip"
                id="zip"
                required
                autocomplete="postal-code"
                title="Your Zip or Postal Code"
                pattern="[A-Za-z0-9\\-\\s]{3,10}"
            /></label>
            <!-- This pattern means letters, numbers, hyphens, and spaces are allowed, with a length between 3 and 10 characters -->
          </fieldset>

          <!-- Payment Information -->
          <fieldset>
            <legend>Payment Information</legend>
            <label
              >Credit Card Number<span class="required">*</span
              ><input
                type="text"
                name="cardNumber"
                id="cardNumber"
                required
                autocomplete="card-number"
                title="Your Credit Card Number"
                pattern="[0-9]{13,16}"
            /></label>
            <!-- This pattern means only digits are allowed, with a length between 13 and 16 digits -->

            <label
              >Expiration Date<span class="required">*</span
              ><input
                type="text"
                name="expiration"
                id="expiration"
                required
                autocomplete="card-expiration"
                title="Your Card Expiration Date (MM/YY)"
                pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                placeholder="MM/YY"
            /></label>
            <label
              >CVV<span class="required">*</span
              ><input
                type="text"
                name="code"
                id="code"
                required
                autocomplete="card-code"
                title="Your Card CVV"
                pattern="[0-9]{3,4}"
            /></label>
            <!-- This pattern means only digits are allowed, with a length of 3 or 4 digits -->
          </fieldset>

          <!-- Order Summary -->
          <fieldset>
            <legend>Summary</legend>
            <div class="order-summary">
              <div>Items <span id="num-items"></span></div>
              <div>Subtotal <span id="cartTotal"></span></div>
              <div>Tax <span id="tax"></span></div>
              <div>Shipping Estimate <span id="shipping"></span></div>
              <div>Order Total <span id="orderTotal"></span></div>
            </div>
          </fieldset>
          <button type="submit" id="place-order-btn">Place Order</button>
        </form>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
